<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>
<div class="card-container">
  <div class="card">
    <img class="card-image" src="./assets/images/illustration-article.svg" alt="yellow black and white abstract illustration">
    <article class="card-text-container">
      <p class="card-label">Learning</p>
      <p class="card-date">Published 21 Dec 2023</p>
      <h2 class="card-heading"> HTML & CSS foundations</h2>
      <p class="card-paragraph">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    </article>
    <div class="author-info">
        <img class="author-avatar" src="./assets/images/image-avatar.webp" alt="Greg Hooper's avatar">
        <p class="author-name">Greg Hooper</p>
      </div>
  </div>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Vladislav Glovatskiy</a>.
  </footer>
</body>
</html>
